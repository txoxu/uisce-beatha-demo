services:
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Tokyo
      WATCHPACK_POLLING: true
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
    command: yarn dev -p 4000
    ports:
      - "4000:4000"
  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    environment:
      RAILS_ENV: development
      TZ: Asia/Tokyo
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -b '0.0.0.0'"
    volumes:
      - ./back:/app
      - back_bundle_data:/usr/local/bundle:cached
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    tty: true
    stdin_open: true
  db:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: my_app
    ports:
      - "3306:3306"
    healthcheck:
      test:  mysqladmin ping -h 127.0.0.1 -uroot -ppassword
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  front_node_modules:
  back_bundle_data:
  mysql_data:

